name: Build Pepko Equalizer APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run Standard Capacitor Web Package Setup
      run: |
        npm install --legacy-peer-deps
        npx cap sync android --inline
      continue-on-error: true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Official Modern Gradle Action
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Compile Native Project Layout
      run: |
        cd android
        
        echo "android.useAndroidX=true" >> local.properties
        echo "android.enableJetifier=true" >> local.properties
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        
        echo "Patching manifest properties configuration limit..."
        find . -name "AndroidManifest.xml" -exec sed -i 's/mediaProcessing/mediaPlayback/g' {} +
        
        # FIXED EXCEPTION OVERRIDE: Prevent old C++ configuration validation crashes
        find . -name "*.kt" -exec sed -i 's/\.enabled =/.enabled =/g' {} +
        find . -name "*.kt" -exec sed -i 's/effect\.enabled = true/try { effect.enabled = true } catch(e: Exception) {}/g' {} +
        find . -name "*.kt" -exec sed -i 's/it\.enabled = false/try { it.enabled = false } catch(e: Exception) {}/g' {} +
        
        if [ ! -f "./gradlew" ]; then
          echo "Local compiler wrapper missing. Re-generating fresh binaries..."
          gradle wrapper --gradle-version 8.4
        fi
        
        chmod +x gradlew
        # Run the official multi-project application wrapper execution directly via the inner app module configuration
        ./gradlew :app:assembleDebug --no-daemon || ./gradlew assembleDebug --no-daemon || ./gradlew assemble --no-daemon

    - name: Find and Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Pepko-Equalizer-APK
        path: |
          **/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/release/*.apk
          **/build/outputs/apk/*/*.apk
