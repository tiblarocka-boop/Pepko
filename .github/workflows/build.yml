name: Build Pepko Equalizer APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Direct Android Native Build Execution
      run: |
        echo "Determining project folder layout target..."
        if [ -d "./android" ]; then
          cd ./android
        fi

        echo "Injecting mandatory AndroidX architecture properties flags..."
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        
        echo "Patching system configuration limits inside manifest files..."
        find . -name "AndroidManifest.xml" -exec sed -i 's/mediaProcessing/mediaPlayback/g' {} +

        echo "Ensuring the baseline Gradle compilation compiler wrapper tools are ready..."
        sudo apt-get update && sudo apt-get install -y gradle
        if [ ! -f "./gradlew" ]; then
          gradle wrapper --gradle-version 8.4
        fi
        chmod +x gradlew

        echo "Executing explicit hardware deployment binaries compilation..."
        # Force a direct layout-safe compilation task execution bypassing structural empty wrappers
        ./gradlew assembleDebug --no-daemon || ./gradlew :app:assembleDebug --no-daemon || ./gradlew assemble --no-daemon

    - name: Find and Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Pepko-Equalizer-APK
        path: |
          **/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/release/*.apk
          **/build/outputs/apk/*/*.apk
