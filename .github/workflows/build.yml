name: Build Pepko Equalizer APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Compile Standalone Application
      run: |
        echo "Entering execution context..."
        if [ -d "./android" ]; then
          cd ./android
        fi

        echo "MANDATORY RE-BUILD: Injecting explicit base project files on the fly..."
        echo "rootProject.name = 'Pepko'" > settings.gradle
        
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
            }
        }

        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }

        apply plugin: 'com.android.application'
        apply plugin: 'kotlin-android'

        android {
            namespace 'com.fatyliser.eq'
            compileSdk 34

            defaultConfig {
                applicationId 'com.fatyliser.eq'
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            
            buildFeatures {
                compose true
            }

            composeOptions {
                kotlinCompilerExtensionVersion '1.5.8'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.13.1'
            implementation 'androidx.activity:activity-compose:1.9.0'
            implementation platform('androidx.compose:compose-bom:2024.05.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.ui:ui-graphics'
            implementation 'androidx.compose.material3:material3'
            implementation 'com.getcapacitor:android:6.1.2'
        }
        EOF

        echo "Ensuring the modern Gradle environment tools are generated..."
        sudo apt-get update && sudo apt-get install -y gradle
        gradle wrapper --gradle-version 8.4
        chmod +x ./gradlew

        echo "Injecting target integration properties flags..."
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        
        echo "Patching system configuration limits inside manifest files..."
        find . -name "AndroidManifest.xml" -exec sed -i 's/mediaProcessing/mediaPlayback/g' {} +

        echo "Executing explicit hardware deployment binaries compilation via wrapper 8.4..."
        # TARGET FIX: Force compilation via the explicit modern local wrapper script execution dot-slash path
        ./gradlew assembleDebug --no-daemon

    - name: Find and Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Pepko-Equalizer-APK
        path: |
          **/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/release/*.apk
