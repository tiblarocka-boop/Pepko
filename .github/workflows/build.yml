name: Build Pepko Equalizer APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Auto-Initialize and Build Project
      run: |
        echo "Entering your project compilation directory..."
        if [ -d "./android" ]; then
          cd ./android
        fi

        echo "Ensuring baseline Gradle infrastructure is completely present..."
        sudo apt-get update && sudo apt-get install -y gradle
        
        # MANDATORY OVERRIDE: If settings.gradle is broken or missing, force initialization
        if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
          echo "Empty root layout detected. Initializing clean build shell..."
          gradle init --type basic --dsl kotlin --package com.fatyliser.eq --project-name Pepko --non-interactive
        fi

        echo "Re-generating fresh Gradle Wrapper assets..."
        gradle wrapper --gradle-version 8.4
        chmod +x gradlew

        echo "Injecting target integration properties flags..."
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        
        echo "Patching manifest background system limits..."
        find . -name "AndroidManifest.xml" -exec sed -i 's/mediaProcessing/mediaPlayback/g' {} +

        echo "Compiling final hardware deployment binaries..."
        ./gradlew assembleDebug --no-daemon || ./gradlew assemble --no-daemon

    - name: Find and Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Pepko-Equalizer-APK
        path: |
          **/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/release/*.apk
          **/build/outputs/apk/*/*.apk
