name: Build Pepko Equalizer APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Web & Capacitor Dependencies
      run: |
        npm install --legacy-peer-deps
        npm install @capacitor/android@6.1.2 --legacy-peer-deps

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Official Modern Gradle Action
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Compile Standalone Application
      run: |
        echo "Entering execution context..."
        if [ -d "./android" ]; then
          cd ./android
        fi

        echo "MANDATORY WIPE: Purging hidden glitched settings templates..."
        rm -f settings.gradle settings.gradle.kts build.gradle build.gradle.kts
        
        echo "Injecting pure centralized dependency resolution structure..."
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            // TARGET FIX: Universal robust repository mode strategy to guarantee clean asset lookup
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = 'Pepko'
        EOF
        
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
            }
        }

        apply plugin: 'com.android.application'
        apply plugin: 'kotlin-android'

        android {
            namespace 'com.fatyliser.eq'
            compileSdk 34

            defaultConfig {
                applicationId 'com.fatyliser.eq'
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            
            buildFeatures {
                compose true
            }

            composeOptions {
                kotlinCompilerExtensionVersion '1.5.8'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:androidx.appcompat:1.6.1'
            implementation 'androidx.activity:activity-compose:1.8.2'
            implementation platform('androidx.compose:compose-bom:2024.02.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.ui:ui-graphics'
            implementation 'androidx.compose.material3:material3'
            
            implementation fileTree(dir: '../node_modules/@capacitor/android/capacitor-android', include: ['*.aar', '*.jar'])
        }
        EOF

        echo "Injecting target integration properties flags..."
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        
        echo "Patching system configuration limits inside manifest files..."
        find . -name "AndroidManifest.xml" -exec sed -i 's/mediaProcessing/mediaPlayback/g' {} +

        echo "Executing explicit hardware deployment binaries compilation..."
        gradle assembleDebug --no-daemon

    - name: Find and Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Pepko-Equalizer-APK
        path: |
          **/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/release/*.apk
