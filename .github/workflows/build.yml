name: Build Pepko Equalizer APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run Standard Capacitor Web Package Setup
      run: |
        npm install --legacy-peer-deps
        npx cap sync android --inline
      continue-on-error: true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Official Modern Gradle Action
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Compile Native Project Layout
      run: |
        # Target the exact project directory exported by AI Studio
        cd android
        
        echo "android.useAndroidX=true" >> local.properties
        echo "android.enableJetifier=true" >> local.properties
        
        echo "Patching manifest properties configuration limit..."
        find . -name "AndroidManifest.xml" -exec sed -i 's/mediaProcessing/mediaPlayback/g' {} +
        
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Find and Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Pepko-Equalizer-APK
        path: |
          **/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/release/*.apk
