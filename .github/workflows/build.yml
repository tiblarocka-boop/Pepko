name: Build Pepko Equalizer APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Multi-Project Target Build
      run: |
        echo "Locating the exact Android source path..."
        if [ -d "./android" ]; then
          cd ./android
        fi

        echo "Injecting required deployment flags..."
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        
        echo "Patching system configuration limits..."
        find . -name "AndroidManifest.xml" -exec sed -i 's/mediaProcessing/mediaPlayback/g' {} +

        echo "Forcing sub-project module compilation..."
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          # TARGET FIX: Direct assemble command explicitly onto the inner app module sub-project
          ./gradlew :app:assembleDebug --no-daemon
        else
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
        fi

    - name: Find and Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Pepko-Equalizer-APK
        path: |
          **/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/release/*.apk
