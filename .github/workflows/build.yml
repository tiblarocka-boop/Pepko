name: Build Pepko Equalizer APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Smart-Scan and Build Android Project
      run: |
        echo "Scanning folders for Android Gradle build configurations..."
        
        # Look for build configurations or fall back directly to the verified android directory
        if [ -d "./android" ]; then
          TARGET_DIR="./android"
        else
          TARGET_DIR=$(find . -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs -r dirname)
        fi
        
        if [ -z "$TARGET_DIR" ] || [ "$TARGET_DIR" = "." ]; then
          TARGET_DIR="."
        fi
        
        echo "Target directory determined as: $TARGET_DIR"
        
        echo "Injecting mandatory AndroidX flags into properties..."
        echo "android.useAndroidX=true" >> "$TARGET_DIR/gradlew.properties"
        echo "android.useAndroidX=true" >> "$TARGET_DIR/gradle.properties"
        
        echo "Patching AndroidManifest foregroundServiceType version mapping mismatch..."
        find . -name "AndroidManifest.xml" -exec sed -i 's/mediaProcessing/mediaPlayback/g' {} +
        
        cd "$TARGET_DIR"
        
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          # Fallback if the raw compiler isn't built yet
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug
        fi

    - name: Find and Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Pepko-Equalizer-APK
        path: |
          **/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/release/*.apk
