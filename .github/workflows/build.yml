name: Build Pepko Equalizer APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Deep Scan and Build Android Project
      run: |
        echo "Combing through repository to find where build.gradle or settings.gradle is hidden..."
        # Find the true internal project folder path automatically
        REAL_PROJECT_DIR=$(find . -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs -r dirname)
        
        if [ -z "$REAL_PROJECT_DIR" ]; then
          echo "No custom project directories detected. Defaulting to root folder path..."
          REAL_PROJECT_DIR="."
        fi
        
        echo "Target directory successfully located at: $REAL_PROJECT_DIR"
        cd "$REAL_PROJECT_DIR"

        echo "Injecting required deployment configuration flags..."
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        
        echo "Patching manifest properties mismatch..."
        find . -name "AndroidManifest.xml" -exec sed -i 's/mediaProcessing/mediaPlayback/g' {} +

        echo "Ensuring Gradle wrapper execution tools are built..."
        sudo apt-get update && sudo apt-get install -y gradle
        if [ ! -f "./gradlew" ]; then
          gradle wrapper --gradle-version 8.4
        fi
        chmod +x gradlew

        echo "Executing full module asset bundle assembly..."
        # Check if an app sub-project exists, otherwise run global compilation
        if grep -q "app" settings.gradle 2>/dev/null; then
          ./gradlew :app:assembleDebug --no-daemon
        else
          ./gradlew assembleDebug --no-daemon || ./gradlew assemble --no-daemon
        fi

    - name: Find and Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Pepko-Equalizer-APK
        path: |
          **/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/release/*.apk
          **/build/outputs/apk/*/*.apk
