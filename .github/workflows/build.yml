name: Build Pepko Equalizer APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Multi-Project Target Build
      run: |
        echo "Locating the exact Android source path..."
        if [ -d "./android" ]; then
          cd ./android
        fi

        echo "Injecting required deployment flags..."
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        
        echo "Patching system configuration limits..."
        find . -name "AndroidManifest.xml" -exec sed -i 's/mediaProcessing/mediaPlayback/g' {} +

        echo "Ensuring Gradle wrapper tools are built..."
        sudo apt-get update && sudo apt-get install -y gradle
        if [ ! -f "./gradlew" ]; then
          gradle wrapper --gradle-version 8.4
        fi
        chmod +x gradlew

        echo "Dynamically determining the correct module task name..."
        # Scan settings.gradle to extract the exact project module name used by AI Studio
        MODULE_NAME=$(grep -o "include ':[^']*'" settings.gradle | head -n 1 | sed "s/include '://;s/'//")
        
        if [ -z "$MODULE_NAME" ]; then
          echo "No explicit sub-project module found. Falling back to global execution..."
          ./gradlew assembleDebug --no-daemon
        else
          echo "Found active project module: $MODULE_NAME"
          ./gradlew :$MODULE_NAME:assembleDebug --no-daemon
        fi

    - name: Find and Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Pepko-Equalizer-APK
        path: |
          **/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/release/*.apk
